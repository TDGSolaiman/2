<!DOCTYPE html>
<html lang="nl">
<head>
  <!--
  Sovexa Labs pause listener
  Paste this <script> into the <head> of EACH of the four apps' index.html,
  BEFORE any other <script>. Then redeploy each app on Vercel.

  It lets the Shopify homepage pause and resume this animation, and tells the
  homepage when a visitor interacts with it. Nothing changes when the app is
  opened on its own (outside the homepage).
-->
<script>
(function () {
  var nativeRaf = window.requestAnimationFrame.bind(window);
  var nativeCancel = window.cancelAnimationFrame.bind(window);
  var paused = false;
  var queued = new Map();
  var nextId = -1;

  // While paused, frame callbacks are held instead of run, so the loop fully stops.
  window.requestAnimationFrame = function (callback) {
    if (!paused) return nativeRaf(callback);
    var id = nextId--;
    queued.set(id, callback);
    return id;
  };
  window.cancelAnimationFrame = function (id) {
    if (queued.has(id)) { queued.delete(id); return; }
    nativeCancel(id);
  };

  function pause() {
    paused = true;
  }

  function play() {
    if (!paused) return;
    paused = false;
    var callbacks = Array.from(queued.values());
    queued.clear();
    // Each app clamps its time step, so the first frame after resuming does not jump.
    callbacks.forEach(function (callback) { nativeRaf(callback); });
  }

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || data.source !== 'Sovexa Labs-host') return;
    if (data.type === 'pause') pause();
    if (data.type === 'play') play();
  });

  function activate() {
    if (window.parent === window) return;
    window.parent.postMessage({ source: 'Sovexa Labs-embed', type: 'activate' }, '*');
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (type) {
    window.addEventListener(type, activate, { capture: true, passive: true });
  });

  if (window.parent !== window) {
    window.parent.postMessage({ source: 'Sovexa Labs-embed', type: 'ready' }, '*');
  }
})();
</script>

<script>
// ====== INSTELLINGEN (pas gerust aan) ======
const SPLIT_COOLDOWN = 1.0;    // seconden voordat een bal opnieuw kan worden geplet (hoger = trager)
const SWING_SPEED    = 1.2;    // hoe snel de crusher zwaait
const OVERFLOW_ZONE  = 0.62;   // de "bovenzone": alles boven dit punt (0 = midden, 1 = bovenrand) telt voor overflow
const OVERFLOW_FILL  = 0.36;   // hoe vol die bovenzone moet zitten met ballen (0.30 = 30%)
const OVERFLOW_HOLD  = 1.0;    // seconden dat het vol moet blijven voordat de muur breekt
const WALL_BREAK_DELAY = 0.75; // ballen blijven binnen terwijl de muur zichtbaar uiteenvalt
// ===========================================

const TAU = Math.PI * 2;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let displayDpr = 1, W, H, dpr, R, Ri, cx, cy, S, rb, P, G, zoneY, zoneArea;
let arenaLeft = 0, arenaRight = 0, arenaTop = 0, arenaBottom = 0;
let crusherWidth = 0, crusherHeight = 0, sliderX = 0, sliderVX = 0;
const SEG = 72;
let balls, t, state, burstT, pieces;
let swingA = 0.7, wedgeTouch = false, wedgeSpeed = 0;
let crusherIsClosing = false;
let ballSide = "left";
let spawnQueue = [], fx = [], sparks = [];
let baseLayer = null, ringLayer = null;
let hueSprites = [], customSprite = null;
let overflowTimer = 0, checkAcc = 0;
let overflowPending = false, wallOpened = false;

// ---------- opties (worden door het menu onderaan aangepast) ----------
let colorMode = "original", customColor = "#ff6b9a", customHSL = { h: 340, s: 100, l: 71 }, simSpeed = 1;

function resize() {
  displayDpr = Math.min(window.devicePixelRatio || 1, 2);
  dpr = displayDpr;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);

  R = Math.min(W * 0.36, H * 0.37);
  Ri = R * 0.92;
  cx = W / 2; cy = H * 0.53;
  S = R / 400;
  rb = Math.max(2.5, R * 0.02);
  G = 650 * S;

  arenaLeft = cx - Ri;
  arenaRight = cx + Ri;
  arenaTop = cy - Ri;
  arenaBottom = cy + Ri;
  P = { x: cx, y: cy };

  crusherWidth = (arenaRight - arenaLeft) * 0.20;
  crusherHeight = arenaBottom - arenaTop + rb * 2;
  sliderX = cx;
  sliderVX = 0;

  zoneY = arenaTop + (arenaBottom - arenaTop) * 0.22;
  zoneArea = (arenaRight - arenaLeft) * (zoneY - arenaTop);

  hueSprites = []; customSprite = null;
  buildLayers();
  reset();
}

// Tekent alles opnieuw in een andere resolutie (zonder de animatie te herstarten)
function setRenderScale(d) {
  dpr = d;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  hueSprites = []; customSprite = null;
  buildLayers();
}

function floorNormal(a, b) {
  let nx = -(b.y - a.y), ny = (b.x - a.x);
  const len = Math.hypot(nx, ny);
  nx /= len; ny /= len;
  if (ny > 0) { nx = -nx; ny = -ny; }  // altijd omhoog
  return { x: nx, y: ny };
}

function reset() {
  const startX = ballSide === "left"
    ? arenaLeft + (arenaRight - arenaLeft) * 0.22
    : arenaRight - (arenaRight - arenaLeft) * 0.22;
  balls = [{ x: startX, y: cy, vx: (Math.random() - 0.5) * 80 * S, vy: 0, h: 20, rh: Math.random() * 360, cd: 0, pop: 0 }];
  t = 0; state = "play"; burstT = 0; pieces = [];
  spawnQueue = []; fx = []; sparks = [];
  overflowTimer = 0; checkAcc = 0;
  overflowPending = false; wallOpened = false;
  crushSoundMuted = false;
  crusherIsClosing = false;
}

// ---------- crusher (wig) ----------
let wedgePoly = [], wedgeN = [];

function updateWedge() {
  const half = crusherWidth / 2;
  const minX = ballSide === "left" ? arenaLeft + half : cx + half;
  const maxX = ballSide === "left" ? cx - half : arenaRight - half;
  const mid = (minX + maxX) / 2;
  const travel = Math.max(0, (maxX - minX) / 2);
  sliderX = mid + travel * Math.sin(SWING_SPEED * t);
  sliderVX = travel * SWING_SPEED * simSpeed * Math.cos(SWING_SPEED * t);
  const top = arenaTop - rb;
  const bottom = arenaBottom + rb;
  wedgePoly = [
    { x: sliderX - half, y: top },
    { x: sliderX + half, y: top },
    { x: sliderX + half, y: bottom },
    { x: sliderX - half, y: bottom }
  ];
  wedgeN = [
    { x: 0, y: -1 }, { x: 1, y: 0 },
    { x: 0, y: 1 }, { x: -1, y: 0 }
  ];
}

// ===== SATISFYLAB SOUND SYSTEM =====

let soundContext = null;
let soundMaster = null;
let soundEnabled = true;
let soundVolume = 0.35;
let lastBallSound = 0;
let lastCrusherSound = 0;
let crushSoundMuted = false;

function initSound() {
    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    if (!soundContext) {
        soundContext = new AudioContextClass();

        soundMaster = soundContext.createGain();
        soundMaster.gain.value = soundEnabled ? soundVolume : 0;
        soundMaster.connect(soundContext.destination);
    }

    if (soundContext.state !== "running") {
        soundContext.resume();
    }
}

function playBallHit(impact = 1) {
    if (!soundEnabled || crushSoundMuted) return;

    initSound();
    if (!soundContext) return;

    const now = performance.now();
    if (now - lastBallSound < 45) return;
    lastBallSound = now;

    const strength = Math.min(1, Math.max(0.15, impact / 8));
    const osc = soundContext.createOscillator();
    const gain = soundContext.createGain();

    osc.type = "triangle";
    osc.frequency.setValueAtTime(500 + strength * 450, soundContext.currentTime);
    osc.frequency.exponentialRampToValueAtTime(
        180,
        soundContext.currentTime + 0.045
    );

    gain.gain.setValueAtTime(0.0001, soundContext.currentTime);
    gain.gain.linearRampToValueAtTime(
        0.12 * strength,
        soundContext.currentTime + 0.005
    );
    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        soundContext.currentTime + 0.06
    );

    osc.connect(gain);
    gain.connect(soundMaster);

    osc.start();
    osc.stop(soundContext.currentTime + 0.065);
}

function playWallBreakSound() {
    if (!soundEnabled) return;
    initSound();
    if (!soundContext || !soundMaster) return;

    const t = soundContext.currentTime;

    // Diepe explosie-impact
    const boom = soundContext.createOscillator();
    const boomGain = soundContext.createGain();
    boom.type = "sine";
    boom.frequency.setValueAtTime(95, t);
    boom.frequency.exponentialRampToValueAtTime(28, t + 0.65);
    boomGain.gain.setValueAtTime(0.0001, t);
    boomGain.gain.linearRampToValueAtTime(0.48, t + 0.025);
    boomGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
    boom.connect(boomGain);
    boomGain.connect(soundMaster);
    boom.start(t);
    boom.stop(t + 0.78);

    // Brede ruislaag voor het breken en neerstorten van de muur
    const duration = 0.85;
    const length = Math.floor(soundContext.sampleRate * duration);
    const buffer = soundContext.createBuffer(1, length, soundContext.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
        const fade = Math.pow(1 - i / length, 1.7);
        data[i] = (Math.random() * 2 - 1) * fade;
    }
    const noise = soundContext.createBufferSource();
    const filter = soundContext.createBiquadFilter();
    const noiseGain = soundContext.createGain();
    noise.buffer = buffer;
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(2400, t);
    filter.frequency.exponentialRampToValueAtTime(420, t + duration);
    noiseGain.gain.setValueAtTime(0.0001, t);
    noiseGain.gain.linearRampToValueAtTime(0.32, t + 0.035);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(soundMaster);
    noise.start(t);
    noise.stop(t + duration);
}

function playCrusherSound() {
    if (!soundEnabled) return;

    initSound();
    if (!soundContext) return;

    const now = performance.now();
    if (now - lastCrusherSound < 100) return;
    lastCrusherSound = now;

    const t = soundContext.currentTime;

    // Lage mechanische dreun
    const osc = soundContext.createOscillator();
    const bassGain = soundContext.createGain();

    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(105, t);
    osc.frequency.exponentialRampToValueAtTime(38, t + 0.22);

    bassGain.gain.setValueAtTime(0.0001, t);
    bassGain.gain.linearRampToValueAtTime(0.35, t + 0.015);
    bassGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

    osc.connect(bassGain);
    bassGain.connect(soundMaster);

    osc.start(t);
    osc.stop(t + 0.3);

    // Korte scherpe crunch
    const bufferSize = soundContext.sampleRate * 0.16;
    const buffer = soundContext.createBuffer(
        1, bufferSize, soundContext.sampleRate
    );
    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }

    const noise = soundContext.createBufferSource();
    const filter = soundContext.createBiquadFilter();
    const noiseGain = soundContext.createGain();

    noise.buffer = buffer;
    filter.type = "lowpass";
    filter.frequency.value = 1800;

    noiseGain.gain.setValueAtTime(0.22, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(soundMaster);

    noise.start(t);
}

// Browser audio starten na eerste gebruikersinteractie
document.addEventListener("pointerdown", async () => {
    initSound();

    if (soundContext && soundContext.state !== "running") {
        try {
            await soundContext.resume();
        } catch (err) {
            console.warn("Audio could not be started:", err);
        }
    }

    if (soundMaster) {
        soundMaster.gain.value = soundEnabled ? soundVolume : 0;
    }
});

const soundPrompt = document.getElementById("soundPrompt");
const enableSoundBtn = document.getElementById("enableSoundBtn");

enableSoundBtn.addEventListener("click", async () => {
    initSound();

    try {
        if (soundContext && soundContext.state !== "running") {
            await soundContext.resume();
        }

        if (!soundContext || soundContext.state !== "running") {
            throw new Error("Audio could not be activated.");
        }

        soundEnabled = true;
        soundToggle.checked = true;

        if (soundMaster) {
            soundMaster.gain.value = soundVolume;
        }

        soundPrompt.style.display = "none";

    } catch (err) {
        alert("Sound could not be activated. Please try again.");
        console.warn(err);
    }
});

// ===== SOUND SETTINGS =====

const soundToggle = document.getElementById("soundToggle");
const soundVolumeSlider = document.getElementById("soundVolume");
const soundVolumeVal = document.getElementById("soundVolumeVal");

soundToggle.addEventListener("change", () => {
    soundEnabled = soundToggle.checked;

    if (soundMaster) {
        soundMaster.gain.value = soundEnabled ? soundVolume : 0;
    }
});

soundVolumeSlider.addEventListener("input", () => {
    soundVolume = Number(soundVolumeSlider.value) / 100;

    soundVolumeVal.textContent = soundVolumeSlider.value + "%";

    if (soundMaster) {
        soundMaster.gain.value = soundEnabled ? soundVolume : 0;
    }
});


function bounce(b, nx, ny, vwx, vwy, e) {
  const rx = b.vx - vwx;
  const ry = b.vy - vwy;
  const vn = rx * nx + ry * ny;

  if (vn < 0) {
    const impact = -vn;

    const j = -(1 + e) * vn;
    b.vx += nx * j;
    b.vy += ny * j;

    // Geluid bij botsingen met de omgeving
    if (impact > 35) {
      playBallHit(impact);
    }

    return impact;
  }

  return 0;
}


function collideWedge(b) {
  const n = wedgePoly.length;
  let best = Infinity, bqx = 0, bqy = 0, inside = true;
  let maxSd = -Infinity, maxI = 0;
  for (let i = 0; i < n; i++) {
    const a = wedgePoly[i], c = wedgePoly[(i + 1) % n];
    const ex = c.x - a.x, ey = c.y - a.y;
    let tt = ((b.x - a.x) * ex + (b.y - a.y) * ey) / (ex * ex + ey * ey);
    tt = Math.max(0, Math.min(1, tt));
    const qx = a.x + ex * tt, qy = a.y + ey * tt;
    const d2 = (b.x - qx) ** 2 + (b.y - qy) ** 2;
    const sd = (b.x - a.x) * wedgeN[i].x + (b.y - a.y) * wedgeN[i].y;
    if (sd > 0) inside = false;
    if (sd > maxSd) { maxSd = sd; maxI = i; }
    if (d2 < best) { best = d2; bqx = qx; bqy = qy; }
  }
  let nx, ny, pen;
  if (inside) {
    nx = wedgeN[maxI].x; ny = wedgeN[maxI].y; pen = -maxSd + rb;
  } else {
    const d = Math.sqrt(best);
    if (d >= rb) return 0;
    if (d < 1e-6) { nx = wedgeN[maxI].x; ny = wedgeN[maxI].y; }
    else { nx = (b.x - bqx) / d; ny = (b.y - bqy) / d; }
    pen = rb - d;
  }
  b.x += nx * pen; b.y += ny * pen;
  const vwx = sliderVX, vwy = 0;
  wedgeTouch = true;
  wedgeSpeed = Math.hypot(vwx, vwy);
  return bounce(b, nx, ny, vwx, vwy, 0.98);
}

function enforceBallSide(b) {
  const half = crusherWidth / 2;

  // Harde grens: ballen blijven altijd aan de gekozen kant van de crusher.
  // In de laatste knelzone schuift de grens mee met de buitenmuur.
  if (ballSide === "left") {
    const edge = sliderX - half;
    const limit = Math.max(arenaLeft + rb, edge - rb);
    if (b.x > limit) {
      b.x = limit;
      if (b.vx > sliderVX) bounce(b, -1, 0, sliderVX, 0, 0.65);
    }
  } else {
    const edge = sliderX + half;
    const limit = Math.min(arenaRight - rb, edge + rb);
    if (b.x < limit) {
      b.x = limit;
      if (b.vx < sliderVX) bounce(b, 1, 0, sliderVX, 0, 0.65);
    }
  }
}

function collideSquareWalls(b) {
  if (state !== "burst" || !wallOpened || ballSide !== "left") {
    if (b.x - rb < arenaLeft) {
    b.x = arenaLeft + rb;
      bounce(b, 1, 0, 0, 0, 0.88);
    }
  }
  if (state !== "burst" || !wallOpened || ballSide !== "right") {
    if (b.x + rb > arenaRight) {
      b.x = arenaRight - rb;
      bounce(b, -1, 0, 0, 0, 0.88);
    }
  }
  if (b.y - rb < arenaTop) {
    b.y = arenaTop + rb;
    bounce(b, 0, 1, 0, 0, 0.88);
  }
  if (b.y + rb > arenaBottom) {
    b.y = arenaBottom - rb;
    bounce(b, 0, -1, 0, 0, 0.55);
  }
}

// Is de crusher al in de richting van deze bal gekomen? (pas dan kan hij geplet worden)
function wedgeReached(b) {
  const half = crusherWidth / 2;
  const touchingBlade = ballSide === "left"
    ? b.x < sliderX - half + rb * 2.2
    : b.x > sliderX + half - rb * 2.2;
  const nearOuterWall = ballSide === "left"
    ? b.x - arenaLeft < rb * 2.8
    : arenaRight - b.x < rb * 2.8;
  return touchingBlade && nearOuterWall;
}

// Bal wordt geplet tegen de buitenwand en splitst in twee nieuwe ballen.
function crush(b) {
  if (state !== "play") return;
  crushSoundMuted = true;
  playCrusherSound();
  b.dead = true;
  const wallX = ballSide === "left" ? arenaLeft + rb * 1.2 : arenaRight - rb * 1.2;
  if (fx.length < 300) fx.push({ x: b.x, y: b.y, age: 0 });
  if (sparks.length < 1500) {
    const hue = colorMode === "rainbow" ? b.rh : b.h;
    for (let k = 0; k < 10; k++) {
      const a = Math.random() * TAU, sp = (120 + Math.random() * 260) * S;
      sparks.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, h: hue });
    }
  }
  for (let k = 0; k < 2; k++) {
    spawnQueue.push({
      x: wallX + (ballSide === "left" ? 1 : -1) * Math.random() * rb * 0.5,
      y: Math.max(arenaTop + rb * 2, Math.min(arenaBottom - rb * 2, b.y + (Math.random() - 0.5) * rb * 3)),
      vx: (ballSide === "left" ? 1 : -1) * (80 + Math.random() * 130) * S,
      vy: (Math.random() - 0.5) * 220 * S,
      h: (20 + ((b.h > 180 ? b.h - 360 : b.h) - 20) * 0.7 + Math.random() * 24 - 12 + 360) % 360,
      rh: Math.random() * 360,
      cd: SPLIT_COOLDOWN,
      pop: 0.25
    });
  }
}

// ---------- bal-bal botsingen (spatial grid) ----------
let gridHead = new Int32Array(1), gridNext = new Int32Array(1), gridW = 1, gridH = 1;


function collideBalls() {
  const n = balls.length;
  const cell = rb * 2;
  const md = rb * 2;
  const md2 = md * md;

  // Meer correctierondes wanneer er veel ballen zijn
  const passes = n > 300 ? 5 : n > 150 ? 4 : 3;

  gridW = Math.ceil(W / cell) + 3;
  gridH = Math.ceil(H / cell) + 3;

  if (gridHead.length < gridW * gridH) {
    gridHead = new Int32Array(gridW * gridH);
  }

  if (gridNext.length < n) {
    gridNext = new Int32Array(n + 500);
  }

  for (let pass = 0; pass < passes; pass++) {

    // Grid opnieuw opbouwen bij iedere pass
    gridHead.fill(-1, 0, gridW * gridH);

    for (let i = 0; i < n; i++) {
      const b = balls[i];

      const gx = Math.max(0, Math.min(
        gridW - 1, Math.floor(b.x / cell) + 1
      ));

      const gy = Math.max(0, Math.min(
        gridH - 1, Math.floor(b.y / cell) + 1
      ));

      const idx = gy * gridW + gx;

      gridNext[i] = gridHead[idx];
      gridHead[idx] = i;

      b.gx = gx;
      b.gy = gy;
    }

    for (let i = 0; i < n; i++) {
      const a = balls[i];

      for (let oy = -1; oy <= 1; oy++) {
        const gy = a.gy + oy;
        if (gy < 0 || gy >= gridH) continue;

        for (let ox = -1; ox <= 1; ox++) {
          const gx = a.gx + ox;
          if (gx < 0 || gx >= gridW) continue;

          for (
            let j = gridHead[gy * gridW + gx];
            j !== -1;
            j = gridNext[j]
          ) {
            if (j <= i) continue;

            const b = balls[j];

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const d2 = dx * dx + dy * dy;

            if (d2 >= md2) continue;

            let d = Math.sqrt(d2);
            let nx, ny;

            if (d < 1e-6) {
              const ang = Math.random() * TAU;
              nx = Math.cos(ang);
              ny = Math.sin(ang);
              d = 0;
            } else {
              nx = dx / d;
              ny = dy / d;
            }

            // Geleidelijke positiecorrectie
            const correction = 0.8;
            const pen = (md - d) * 0.5 * correction;

            a.x -= nx * pen;
            a.y -= ny * pen;
            b.x += nx * pen;
            b.y += ny * pen;

            // Bestaande botsingsfysica behouden
            const vn =
              (b.vx - a.vx) * nx +
              (b.vy - a.vy) * ny;

            if (pass === 0 && vn < -0.5) {
              playBallHit(Math.abs(vn));
            }

            if (vn < 0) {
              const jj = -(1.9) * vn * 0.5;

              a.vx -= nx * jj;
              a.vy -= ny * jj;

              b.vx += nx * jj;
              b.vy += ny * jj;
            }
          }
        }
      }
    }
  }
}


// ---------- OVERFLOW: de vierkante arena breekt wanneer de bovenste zone vol raakt ----------
function checkOverflow(dt) {
  checkAcc += dt;
  if (checkAcc < 0.1) return;

  const span = checkAcc;
  checkAcc = 0;

  let cnt = 0;
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i];
    if (ballSide === "left" ? b.x < cx : b.x > cx) cnt++;
  }

  const halfArea = ((arenaRight - arenaLeft) * (arenaBottom - arenaTop)) / 2;
  const filled = (cnt * Math.PI * rb * rb) / halfArea;

  if (filled >= OVERFLOW_FILL) overflowTimer += span;
  else overflowTimer = Math.max(0, overflowTimer - span);

  if (overflowTimer >= OVERFLOW_HOLD || balls.length > 5000) overflowPending = true;
}

function startBurst() {
  if (state !== "play") return;
  state = "burst";
  burstT = 0;
  wallOpened = false;
  overflowPending = false;
  spawnQueue = [];
  balls = balls.filter(b => !b.dead);
  pieces = [];

  // Alleen de wand aan de kant van de samengedrukte ballen breekt.
  const wall = R * 0.075;
  const rows = 12;
  const cols = 2;
  const wallX = ballSide === "left" ? arenaLeft - wall / 2 : arenaRight + wall / 2;
  const pieceW = wall / cols;
  const pieceH = (arenaBottom - arenaTop) / rows;
  const outward = ballSide === "left" ? -1 : 1;

  for (let yy = 0; yy < rows; yy++) {
    for (let xx = 0; xx < cols; xx++) {
      const x = wallX + (xx - (cols - 1) / 2) * pieceW;
      const y = arenaTop + (yy + 0.5) * pieceH;
      const sp = (180 + Math.random() * 260) * S;
      pieces.push({
        x, y,
        vx: outward * sp,
        vy: (Math.random() - 0.5) * 220 * S,
        rot: Math.random() * TAU,
        vr: (Math.random() - 0.5) * 10,
        w: pieceW * 1.15,
        h: pieceH * 1.08
      });
    }
  }

}

function squeezed(b) {
  const nearWall = ballSide === "left"
    ? b.x - arenaLeft < rb * 2.8
    : arenaRight - b.x < rb * 2.8;
  const bladeNearWall = ballSide === "left"
    ? sliderX - crusherWidth / 2 - arenaLeft < rb * 2.8
    : arenaRight - (sliderX + crusherWidth / 2) < rb * 2.8;
  return nearWall && bladeNearWall;
}

function step(dt) {
  t += dt * simSpeed;
  updateWedge();
  crusherIsClosing = ballSide === "left" ? sliderVX < -8 : sliderVX > 8;

  if (crushSoundMuted) {
    const half = crusherWidth / 2;
    const movedAway = ballSide === "left"
      ? sliderVX > 8 && sliderX > arenaLeft + half + rb * 1.5
      : sliderVX < -8 && sliderX < arenaRight - half - rb * 1.5;
    if (movedAway) crushSoundMuted = false;
  }

  const n = balls.length;
  for (let i = 0; i < n; i++) {
    const b = balls[i];
    b.cd -= dt;
    if (b.pop > 0) b.pop -= dt;
    b.vy += G * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    collideSquareWalls(b);
    wedgeTouch = false;
    if (state === "play") {
      collideWedge(b);
      enforceBallSide(b);
    }

    const crusherClosing = ballSide === "left" ? sliderVX < -8 : sliderVX > 8;
    if (state === "play" && !b.dead && wedgeTouch && crusherClosing && b.cd <= 0 && wedgeReached(b) && squeezed(b)) {
      crush(b);
    }
    collideSquareWalls(b);

    // Tot de muur echt openbreekt, blijven alle ballen volledig binnen de arena.
    if (!wallOpened) {
      const minX = arenaLeft + rb;
      const maxX = arenaRight - rb;
      const minY = arenaTop + rb;
      const maxY = arenaBottom - rb;
      if (b.x < minX) { b.x = minX; if (b.vx < 0) b.vx = Math.abs(b.vx) * 0.55; }
      if (b.x > maxX) { b.x = maxX; if (b.vx > 0) b.vx = -Math.abs(b.vx) * 0.55; }
      if (b.y < minY) { b.y = minY; if (b.vy < 0) b.vy = Math.abs(b.vy) * 0.55; }
      if (b.y > maxY) { b.y = maxY; if (b.vy > 0) b.vy = -Math.abs(b.vy) * 0.55; }
    }
  }

  if (spawnQueue.length || fx.length || sparks.length) {
    if (spawnQueue.length) {
      balls = balls.filter(b => !b.dead);
      for (const nb of spawnQueue) balls.push(nb);
      spawnQueue = [];
    }
    for (const f of fx) f.age += dt;
    fx = fx.filter(f => f.age < 0.35);
    for (const sp of sparks) {
      sp.life -= dt;
      sp.vy += G * 0.6 * dt;
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
    }
    sparks = sparks.filter(sp => sp.life > 0);
  }

  if (state === "play") {
    collideBalls();
    checkOverflow(dt);
    if (overflowPending) {
      const half = crusherWidth / 2;
      const crusherAtWall = ballSide === "left"
        ? sliderX - half <= arenaLeft + rb * 0.75
        : sliderX + half >= arenaRight - rb * 0.75;
      if (crusherAtWall) startBurst();
    }
  }
  if (state === "burst") {
    burstT += dt;
    if (!wallOpened && burstT >= WALL_BREAK_DELAY) {
      wallOpened = true;
      playWallBreakSound();
      const outward = ballSide === "left" ? -1 : 1;
      for (const b of balls) {
        b.vx += outward * (300 + Math.random() * 180) * S;
        b.vy += (Math.random() - 0.5) * 220 * S;
      }
    }
    for (const p of pieces) {
      p.vy += 800 * S * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    balls = balls.filter(b => b.y < H + 100 && b.x > -100 && b.x < W + 100);
    if (burstT > 4) { finishRun(); reset(); }
  }
}

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0, s = 0; const l = (mx + mn) / 2, d = mx - mn;
  if (d) {
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return { h, s: s * 100, l: l * 100 };
}

function makeBallSprite(h, s, l) {
  const r = rb * dpr, pad = 2, SZ = Math.ceil(2 * r) + pad * 2;
  const c = document.createElement("canvas");
  c.width = SZ; c.height = SZ;
  const g = c.getContext("2d");
  const cc = SZ / 2;

  // bol met licht van linksboven
  const gr = g.createRadialGradient(cc - r * 0.35, cc - r * 0.4, r * 0.08, cc, cc, r);
  gr.addColorStop(0,    `hsl(${h},${s * 0.6}%,${Math.min(92, l + 30)}%)`);
  gr.addColorStop(0.35, `hsl(${h},${s}%,${l}%)`);
  gr.addColorStop(0.85, `hsl(${h},${s}%,${Math.max(12, l - 24)}%)`);
  gr.addColorStop(1,    `hsl(${h},${s}%,${Math.max(8, l - 36)}%)`);
  g.fillStyle = gr;
  g.beginPath(); g.arc(cc, cc, r, 0, TAU); g.fill();

  // weerkaatst licht rechtsonder
  g.save();
  g.beginPath(); g.arc(cc, cc, r, 0, TAU); g.clip();
  const g2 = g.createRadialGradient(cc + r * 0.3, cc + r * 0.6, 0, cc + r * 0.3, cc + r * 0.6, r * 0.7);
  g2.addColorStop(0, "rgba(255,255,255,0.22)"); g2.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = g2; g.fillRect(0, 0, SZ, SZ);
  g.restore();

  // glanzende highlight
  const g3 = g.createRadialGradient(cc - r * 0.4, cc - r * 0.45, 0, cc - r * 0.4, cc - r * 0.45, r * 0.38);
  g3.addColorStop(0, "rgba(255,255,255,0.95)"); g3.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = g3;
  g.beginPath(); g.arc(cc - r * 0.4, cc - r * 0.45, r * 0.38, 0, TAU); g.fill();

  return { c, size: SZ / dpr };
}

function drawBalls() {
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i];
    let sp;
    if (colorMode === "custom") {
      sp = customSprite || (customSprite = makeBallSprite(customHSL.h, customHSL.s, Math.max(35, Math.min(70, customHSL.l))));
    } else {
      const hi = Math.round((colorMode === "rainbow" ? b.rh : b.h) / 4) % 90;
      sp = hueSprites[hi] || (hueSprites[hi] = makeBallSprite(hi * 4, 75, 60));
    }
    let size = sp.size;
    if (b.pop > 0) size *= 1 - Math.pow(b.pop / 0.25, 2) * 0.7;   // "plop"-effect bij het verschijnen
    ctx.drawImage(sp.c, b.x - size / 2, b.y - size / 2, size, size);
  }
}

// ---------- ring-stukken ----------
function drawPiece(g, x, y, rot, piece = null) {
  const w = piece?.w || R * 0.22;
  const h = piece?.h || R * 0.10;
  g.save();
  g.translate(x, y);
  g.rotate(rot);
  const gr = g.createLinearGradient(-w / 2, 0, w / 2, 0);
  gr.addColorStop(0, "#77779f"); gr.addColorStop(0.5, "#4a4a70"); gr.addColorStop(1, "#2f2f4a");
  g.fillStyle = gr;
  g.fillRect(-w / 2, -h / 2, w, h);
  g.fillStyle = "rgba(255,255,255,0.18)";
  g.fillRect(-w / 2, -h / 2, w, h * 0.12);
  g.restore();
}

// ---------- vaste lagen (1x getekend, daarna alleen gekopieerd) ----------
function makeLayer() {
  const c = document.createElement("canvas");
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { c, g };
}

function bolt(g, x, y, r) {
  g.fillStyle = "#2c2c48";
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.fillStyle = "rgba(255,255,255,0.4)";
  g.beginPath(); g.arc(x - r * 0.3, y - r * 0.3, r * 0.4, 0, TAU); g.fill();
}

function buildLayers() {
  const base = makeLayer(), ring = makeLayer();
  const g = base.g;
  g.fillStyle = "#0b0b14"; g.fillRect(0, 0, W, H);

  g.textAlign = "center";
  g.fillStyle = "#fff";
  g.font = `bold ${R * 0.1}px "Arial Narrow", Arial, sans-serif`;
  g.fillText("Will It Overflow?", cx, arenaTop - R * 0.17);
  g.fillStyle = "#8a8aa8";
  g.font = `${R * 0.045}px Arial, sans-serif`;
  g.fillText("every hit splits a ball", cx, arenaTop - R * 0.09);

  const bg = g.createLinearGradient(arenaLeft, arenaTop, arenaRight, arenaBottom);
  bg.addColorStop(0, "#20203b"); bg.addColorStop(1, "#090913");
  g.fillStyle = bg;
  g.fillRect(arenaLeft, arenaTop, arenaRight - arenaLeft, arenaBottom - arenaTop);

  // Subtiele technische rasterlijnen
  g.strokeStyle = "rgba(150,150,220,0.07)"; g.lineWidth = 1;
  for (let i = 1; i < 8; i++) {
    const x = arenaLeft + (arenaRight - arenaLeft) * i / 8;
    const y = arenaTop + (arenaBottom - arenaTop) * i / 8;
    g.beginPath(); g.moveTo(x, arenaTop); g.lineTo(x, arenaBottom); g.stroke();
    g.beginPath(); g.moveTo(arenaLeft, y); g.lineTo(arenaRight, y); g.stroke();
  }

  // Dikke metalen wanden van de vierkante arena
  const wall = R * 0.075;
  const metal = g.createLinearGradient(0, arenaTop, 0, arenaTop + wall);
  metal.addColorStop(0, "#d0d0e8"); metal.addColorStop(0.45, "#77779f"); metal.addColorStop(1, "#383852");
  g.fillStyle = metal;
  g.fillRect(arenaLeft - wall, arenaTop - wall, arenaRight - arenaLeft + wall * 2, wall);
  g.fillRect(arenaLeft - wall, arenaBottom, arenaRight - arenaLeft + wall * 2, wall);
  g.fillRect(arenaLeft - wall, arenaTop, wall, arenaBottom - arenaTop);
  g.fillRect(arenaRight, arenaTop, wall, arenaBottom - arenaTop);
  g.strokeStyle = "rgba(255,255,255,0.55)"; g.lineWidth = R * 0.006;
  g.strokeRect(arenaLeft, arenaTop, arenaRight - arenaLeft, arenaBottom - arenaTop);

  // Bouten langs de vier randen
  const boltR = R * 0.012;
  for (let i = 1; i < 8; i++) {
    const x = arenaLeft + (arenaRight - arenaLeft) * i / 8;
    const y = arenaTop + (arenaBottom - arenaTop) * i / 8;
    bolt(g, x, arenaTop - wall * 0.5, boltR);
    bolt(g, x, arenaBottom + wall * 0.5, boltR);
    bolt(g, arenaLeft - wall * 0.5, y, boltR);
    bolt(g, arenaRight + wall * 0.5, y, boltR);
  }

  // Vierkante breekrand als aparte laag
  const rg = ring.g;
  rg.strokeStyle = "rgba(150,150,230,0.30)";
  rg.lineWidth = R * 0.055;
  rg.strokeRect(arenaLeft - wall * 0.45, arenaTop - wall * 0.45, arenaRight - arenaLeft + wall * 0.9, arenaBottom - arenaTop + wall * 0.9);

  baseLayer = base; ringLayer = ring;
}

// ---------- de crusher ----------
function drawWedge() {
  const x = sliderX, w = crusherWidth, h = crusherHeight;
  const y = arenaTop - rb;
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = "rgba(0,0,0,0.65)";
  ctx.shadowBlur = R * 0.04;
  ctx.shadowOffsetX = R * 0.015;
  const body = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  body.addColorStop(0, "#454765");
  body.addColorStop(0.25, "#8588b2");
  body.addColorStop(0.5, "#d5d7f0");
  body.addColorStop(0.75, "#8588b2");
  body.addColorStop(1, "#454765");
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.roundRect(-w / 2, 0, w, h, R * 0.025); ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0;

  // Diagonale geel-zwarte industriële veiligheidsstrepen aan beide zijkanten
  const stripeW = R * 0.065;
  for (const side of [-1, 1]) {
    const sx = side < 0 ? -w / 2 : w / 2 - stripeW;
    ctx.save();
    ctx.beginPath();
    ctx.rect(sx, 0, stripeW, h);
    ctx.clip();
    ctx.fillStyle = "#20212c";
    ctx.fillRect(sx, 0, stripeW, h);
    ctx.strokeStyle = "#f2c230";
    ctx.lineWidth = R * 0.026;
    for (let yy = -stripeW; yy < h + stripeW; yy += R * 0.075) {
      ctx.beginPath();
      ctx.moveTo(sx - R * 0.025, yy + stripeW);
      ctx.lineTo(sx + stripeW + R * 0.025, yy - stripeW);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Compact bedieningspaneel met statuslampen
  const panelW = R * 0.205;
  const panelH = R * 0.30;
  const panelY = R * 0.105;
  ctx.fillStyle = "#292b3b";
  ctx.strokeStyle = "#171824";
  ctx.lineWidth = R * 0.009;
  ctx.beginPath();
  ctx.roundRect(-panelW / 2, panelY, panelW, panelH, R * 0.025);
  ctx.fill();
  ctx.stroke();

  // Twee lampen: rood tijdens de persbeweging, groen wanneer de crusher teruggaat
  const lightY = panelY + R * 0.075;
  const lightR = R * 0.024;
  for (const light of [
    { x: -R * 0.047, active: crusherIsClosing, color: "#ff3030", glow: "rgba(255,35,35,0.85)" },
    { x:  R * 0.047, active: !crusherIsClosing, color: "#24e66b", glow: "rgba(35,255,105,0.85)" }
  ]) {
    ctx.beginPath();
    ctx.arc(light.x, lightY, lightR * 1.55, 0, TAU);
    ctx.fillStyle = "#11121b";
    ctx.fill();
    ctx.save();
    ctx.shadowColor = light.active ? light.glow : "transparent";
    ctx.shadowBlur = light.active ? R * 0.055 : 0;
    ctx.beginPath();
    ctx.arc(light.x, lightY, lightR, 0, TAU);
    ctx.fillStyle = light.active ? light.color : "#454653";
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.lineWidth = R * 0.004;
    ctx.stroke();
  }

  // Geel waarschuwingsdriehoek met uitroepteken
  const warningY = panelY + R * 0.205;
  const warningSize = R * 0.075;
  ctx.beginPath();
  ctx.moveTo(0, warningY - warningSize * 0.62);
  ctx.lineTo(-warningSize * 0.62, warningY + warningSize * 0.48);
  ctx.lineTo(warningSize * 0.62, warningY + warningSize * 0.48);
  ctx.closePath();
  ctx.fillStyle = "#f2c230";
  ctx.fill();
  ctx.strokeStyle = "#171824";
  ctx.lineWidth = R * 0.009;
  ctx.stroke();
  ctx.fillStyle = "#20212c";
  ctx.font = `bold ${R * 0.075}px Arial, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("!", 0, warningY + R * 0.008);

  // Metalen bevestigingsbouten langs het midden
  for (let yy = R * 0.48; yy < h - R * 0.04; yy += R * 0.16) {
    bolt(ctx, 0, yy, R * 0.012);
  }
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = R * 0.004;
  ctx.beginPath(); ctx.roundRect(-w / 2, 0, w, h, R * 0.025); ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(baseLayer.c, 0, 0, W, H);

  ctx.drawImage(ringLayer.c, 0, 0, W, H);

  if (state === "burst") {
    const wall = R * 0.075;
    const coverX = ballSide === "left" ? arenaLeft - wall * 1.2 : arenaRight - wall * 0.25;
    const coverW = wall * 1.45;
    ctx.fillStyle = "#0b0b14";
    ctx.fillRect(coverX, arenaTop - wall, coverW, arenaBottom - arenaTop + wall * 2);

    for (const p of pieces) drawPiece(ctx, p.x, p.y, p.rot, p);
  }

  drawBalls();
  drawWedge();

  // plet-effecten: ring + vonkjes
  for (const f of fx) {
    ctx.strokeStyle = `rgba(255,255,255,${1 - f.age / 0.35})`;
    ctx.lineWidth = Math.max(1, rb * 0.5);
    ctx.beginPath();
    ctx.arc(f.x, f.y, rb * (1 + (f.age / 0.35) * 5), 0, TAU);
    ctx.stroke();
  }
  for (const sp of sparks) {
    ctx.globalAlpha = Math.max(0, sp.life / 0.45);
    ctx.fillStyle = colorMode === "custom" ? customColor : `hsl(${Math.round(sp.h)},85%,70%)`;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, Math.max(1, rb * 0.4), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // teller (geen limiet meer: gewoon het aantal ballen)
  ctx.textAlign = "center";
  ctx.fillStyle = "#8a8aa8";
  ctx.font = `${R * 0.05}px Arial, sans-serif`;
  ctx.fillText(`${balls.length} balls`, cx, cy + R + R * 0.1);
}

// ====== OPTIES: kleur, snelheid, opname ======
const $ = id => document.getElementById(id);

$("gear").addEventListener("click", () => $("panel").classList.toggle("open"));

$("ballSide").addEventListener("change", e => { ballSide = e.target.value; reset(); });

$("colorMode").addEventListener("change", e => {
  colorMode = e.target.value;
  $("colorRow").style.display = colorMode === "custom" ? "flex" : "none";
});
$("colorPick").addEventListener("input", e => {
  customColor = e.target.value;
  customHSL = hexToHsl(customColor);
  customSprite = null;
});

$("speed").addEventListener("input", e => {
  simSpeed = parseFloat(e.target.value);
  $("speedVal").textContent = simSpeed.toFixed(2).replace(/0$/, "") + "×";
});

$("restartBtn").addEventListener("click", () => reset());

// --- opnemen ---
let recorder = null, recChunks = [], recTimer = null, recStart = 0, recMime = "", lastRecordingUrl = null;

function pickMime() {
  // Kies een formaat dat video én audio expliciet ondersteunt.
  const opts = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm",
    "video/mp4;codecs=avc1,mp4a.40.2",
    "video/mp4"
  ];
  return opts.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}

 
async function startRecording() {
  if (!window.MediaRecorder || !canvas.captureStream) {
    alert("Your browser does not support recording this animation.");
    return;
  }

  if ($("recRestart").checked) reset();
  if (lastRecordingUrl) { URL.revokeObjectURL(lastRecordingUrl); lastRecordingUrl = null; }
  $("recDownload").hidden = true;
  recMime = pickMime();

  // Audio activeren
  initSound();

  if (soundContext && soundContext.state === "suspended") {
    await soundContext.resume();
  }

  // Resolutie instellen
  const target = parseInt($("recQuality").value, 10) || 0;

  if (target) {
    try {
      setRenderScale(target / Math.min(W, H));
    } catch (err) {
      setRenderScale(displayDpr);
      alert("This quality is too demanding. Choose a lower one.");
      return;
    }
  }

  const pixels = canvas.width * canvas.height;
  const bitrate = Math.round(
    Math.min(60e6, Math.max(8e6, pixels * 60 * 0.08))
  );

  let stream;
  let audioDestination = null;

  try {
    const videoStream = canvas.captureStream(60);
    const tracks = [...videoStream.getVideoTracks()];

    // Maak voor ELKE opname een nieuwe audiotrack.
    // De vorige track wordt na het opslaan namelijk stopgezet.
    if (soundContext && soundMaster && soundEnabled) {
      audioDestination = soundContext.createMediaStreamDestination();
      soundMaster.connect(audioDestination);
      const audioTracks = audioDestination.stream.getAudioTracks();
      tracks.push(...audioTracks);
    }

    stream = new MediaStream(tracks);

    const recorderOptions = { videoBitsPerSecond: bitrate, audioBitsPerSecond: 128000 };
    if (recMime) recorderOptions.mimeType = recMime;
    recorder = new MediaRecorder(stream, recorderOptions);

    recChunks = [];
  } catch (err) {
    restoreScale();
    alert("Recording could not start. Try a lower quality.");
    return;
  }

  recorder.ondataavailable = e => {
    if (e.data && e.data.size) recChunks.push(e.data);
  };

  recorder.onstop = () => {
    const finishedMime = recorder ? recorder.mimeType : recMime;
    saveRecording(finishedMime);
    stream.getTracks().forEach(track => track.stop());
    if (audioDestination) {
      try { soundMaster.disconnect(audioDestination); } catch (err) {}
      audioDestination = null;
    }
  };

  recorder.start(250);

  recStart = performance.now();
  $("recBtn").classList.add("on");
  updateRecLabel();
  recTimer = setInterval(updateRecLabel, 500);
}


function updateRecLabel() {
  const sec = Math.floor((performance.now() - recStart) / 1000);
  const m = Math.floor(sec / 60), r = String(sec % 60).padStart(2, "0");
  $("recBtn").textContent = `■ Stop recording (${m}:${r})`;
}

function stopRecording() {
  if (recorder && recorder.state !== "inactive") recorder.stop();
  clearInterval(recTimer);
  $("recBtn").classList.remove("on");
  $("recBtn").textContent = "● Start recording";
}

function restoreScale() {
  if (dpr !== displayDpr) setRenderScale(displayDpr);
}

function updateRecInfo() {
  const target = parseInt($("recQuality").value, 10) || 0;
  const sc = target ? target / Math.min(W, H) : displayDpr;
  $("recInfo").textContent = `Video resolution: ${Math.round(W * sc)} × ${Math.round(H * sc)} px` +
    (target >= 1440 ? " (may be demanding for your device)" : "");
}
$("recQuality").addEventListener("change", updateRecInfo);

function saveRecording(recordedType) {
  const type = recordedType || recMime || "video/webm";
  const blob = new Blob(recChunks, { type });
  const ext = type.includes("mp4") ? "mp4" : "webm";
  recorder = null;
  restoreScale();

  if (!blob.size) {
    alert("The recording is empty. Please try recording again.");
    return;
  }

  lastRecordingUrl = URL.createObjectURL(blob);
  const downloadLink = $("recDownload");
  downloadLink.href = lastRecordingUrl;
  downloadLink.download = `satisfylab-recording.${ext}`;
  downloadLink.hidden = false;
  downloadLink.textContent = `↓ Download recording (${(blob.size / 1024 / 1024).toFixed(1)} MB)`;

  // Probeer automatisch te downloaden. De zichtbare link blijft beschikbaar
  // als de browser deze automatische download tegenhoudt.
  if ($("recAutoDownload").checked) {
    downloadLink.click();
  }
}

function isRecording() { return recorder && recorder.state === "recording"; }

// wordt aangeroepen als de overflow-animatie klaar is
function finishRun() {
  if (isRecording() && $("recAuto").checked) stopRecording();
}

$("recBtn").addEventListener("click", () => (isRecording() ? stopRecording() : startRecording()));

// ====== hoofdlus ======
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(0.05, (now - last) / 1000);
  last = now;
  const DT = 1 / 120;
  let guard = 0;
  while (acc >= DT && guard++ < 40) { step(DT); acc -= DT; }
  if (acc > DT * 40) acc = 0;
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener("resize", () => { if (!isRecording()) { resize(); updateRecInfo(); } });
resize();
updateRecInfo();
requestAnimationFrame(loop);

</script>
